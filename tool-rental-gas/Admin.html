<!--
  Admin.html — 管理画面（?view=admin）
  最初に admin_pin を要求（通ったら sessionStorage に保持）。
  機能: 工具箱の追加 / 編集 / 削除（工具箱ごとに管理者名・管理者メール）、工具の追加 / 編集 / 削除（工具箱の割り当て）、代理の貸出・返却（端末に関係なく可能）、QR 用 URL（コピー・QR 画像）、QR 一括印刷、設定編集、直近50件のログ。
  QR 描画は CDN の qrcode.js（読み込めなくても URL は必ず表示）。
-->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <base target="_top">
  <title><?= pageTitle ?></title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<?!= include_('Common', { appUrl: appUrl }) ?>
<div class="wrap">
  <h1>管理</h1>
  <div id="msg"></div>

  <!-- PIN 入力 -->
  <form id="gate" class="card">
    <label for="pin">PIN</label>
    <input type="password" id="pin" inputmode="numeric" pattern="[0-9]*" autocomplete="off" required>
    <button type="submit" class="btn full">入る</button>
  </form>

  <div id="main" hidden>
    <div id="urlWarn"></div>

    <h2>工具箱</h2>
    <div class="muted" style="margin-bottom:8px">工具箱ごとに管理者を分けられます。通知はその工具箱の管理者メールに届き、使用者には「〇〇に返却してください」と表示されます。</div>
    <form id="addBoxForm" class="card">
      <div class="row">
        <input type="text" id="boxName" placeholder="工具箱名（例: 1F工具箱）" required>
        <input type="text" id="boxManager" placeholder="管理者名">
        <input type="email" id="boxEmail" placeholder="管理者メール">
        <button type="submit" class="btn small">追加</button>
      </div>
    </form>
    <div id="boxes"></div>

    <h2>工具の追加</h2>
    <form id="addForm" class="card">
      <div class="row">
        <input type="text" id="addName" placeholder="工具名" required>
        <select id="addBox"><option value="">工具箱なし</option></select>
        <button type="submit" class="btn small">追加</button>
      </div>
    </form>

    <h2>工具</h2>
    <div class="row" style="margin: 0 0 10px">
      <button type="button" class="btn small gray" id="printBtn">QRを一括印刷</button>
      <button type="button" class="btn small gray" id="reloadBtn">更新</button>
    </div>
    <div id="overdueBanner"></div>
    <div id="tools" class="muted">読み込み中…</div>

    <h2>設定</h2>
    <div class="card">
      <label>管理者</label>
      <div class="row">
        <button type="button" class="btn small" id="typeHuman" data-type="human">human（人）</button>
        <button type="button" class="btn small" id="typeAi" data-type="ai">ai（AI）</button>
      </div>
      <div class="muted" id="aiNote" style="margin-top:6px"></div>

      <label style="margin-top:14px">
        <input type="checkbox" id="notifyOnRequest"> 貸出時に管理者へメールを送る
      </label>
      <div class="muted">オフにしても、返却日超過・延長・返却の通知は送られます</div>

      <label for="managerEmail">管理者メール</label>
      <div class="row">
        <input type="email" id="managerEmail">
        <button type="button" class="btn small" id="saveEmail">保存</button>
      </div>

      <label for="newPin">PIN（4〜6桁）</label>
      <div class="row">
        <input type="text" id="newPin" inputmode="numeric" pattern="[0-9]{4,6}" maxlength="6">
        <button type="button" class="btn small" id="savePin">保存</button>
      </div>

      <label for="appUrlInput">Web アプリ URL（app_url）</label>
      <div class="row">
        <input type="text" id="appUrlInput" placeholder="https://script.google.com/macros/s/…/exec">
        <button type="button" class="btn small" id="saveUrl">保存</button>
      </div>
    </div>

    <h2>貸出ログ（直近50件）</h2>
    <div class="card scroll">
      <table>
        <thead><tr><th>日時</th><th>操作</th><th>工具</th><th>使用者</th><th>返却日</th><th>備考</th></tr></thead>
        <tbody id="logs"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  const PIN_KEY = 'tr_admin_pin';
  const TODAY = <?!= toJson_(data.today) ?>;
  const DEFAULT_DUE = <?!= toJson_(data.defaultDue) ?>;
  let PIN = storeGet('session', PIN_KEY) || '';
  let DATA = null;

  const gate = document.getElementById('gate');
  const main = document.getElementById('main');

  // ---- PIN ----
  gate.addEventListener('submit', async function (ev) {
    ev.preventDefault();
    const pin = document.getElementById('pin').value.trim();
    showMsg('msg', '確認中…', 'info');
    try {
      await call('adminVerifyPin', pin);
      PIN = pin;
      storeSet('session', PIN_KEY, pin);
      showMsg('msg', '');
      enter();
    } catch (e) {
      showMsg('msg', e.message || String(e), 'err');
    }
  });

  async function enter() {
    gate.hidden = true;
    main.hidden = false;
    await load();
  }

  async function load() {
    try {
      DATA = await call('adminGetData', PIN);
      renderAll();
    } catch (e) {
      showMsg('msg', e.message || String(e), 'err');
      if (/PIN/.test(e.message || '')) { storeDel('session', PIN_KEY); PIN = ''; gate.hidden = false; main.hidden = true; }
    }
  }

  function renderAll() {
    renderBoxes(DATA.boxes);
    renderTools(DATA.tools);
    renderSettings(DATA.settings);
    renderLogs(DATA.logs);
    const w = document.getElementById('urlWarn');
    w.innerHTML = DATA.settings.app_url ? '' :
      '<div class="msg err">app_url が未設定です。デプロイ後の Web アプリ URL を下の設定で保存してください（QR・メールのリンクに使います）。</div>';
  }

  // ---- 工具箱 ----
  function boxSelect(cls, current) {
    return '<select class="' + cls + '"><option value="">工具箱なし</option>' +
      (DATA.boxes || []).map(b => '<option value="' + esc(b.id) + '"' + (b.id === current ? ' selected' : '') + '>' + esc(b.name) + (b.managerName ? '（' + esc(b.managerName) + '）' : '') + '</option>').join('') +
      '</select>';
  }
  function renderBoxes(boxes) {
    const box = document.getElementById('boxes');
    box.innerHTML = (boxes || []).length ? boxes.map(b =>
      '<div class="card" data-box="' + esc(b.id) + '">' +
      '<div class="head"><b>' + esc(b.id) + '</b> <span class="muted">' + esc(b.toolCount) + ' 点</span></div>' +
      '<div class="row">' +
      '<input type="text" class="bName" value="' + esc(b.name) + '" placeholder="工具箱名">' +
      '<input type="text" class="bManager" value="' + esc(b.managerName) + '" placeholder="管理者名">' +
      '<input type="email" class="bEmail" value="' + esc(b.managerEmail) + '" placeholder="管理者メール">' +
      '</div>' +
      '<div class="row">' +
      '<button type="button" class="btn small" data-bact="save">保存</button>' +
      '<button type="button" class="btn small red" data-bact="del"' + (b.toolCount ? ' disabled' : '') + '>削除</button>' +
      '</div></div>'
    ).join('') : '<div class="muted">工具箱はまだありません（無くても動きます。通知は設定の管理者メール宛て）</div>';
    const sel = document.getElementById('addBox');
    const cur = sel.value;
    sel.innerHTML = '<option value="">工具箱なし</option>' + (boxes || []).map(b => '<option value="' + esc(b.id) + '">' + esc(b.name) + '</option>').join('');
    sel.value = cur;
  }
  document.getElementById('addBoxForm').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    const btn = this.querySelector('button[type=submit]');
    btnBusy(btn, '追加中…');
    try {
      const b = await call('adminAddBox', PIN, document.getElementById('boxName').value, document.getElementById('boxManager').value, document.getElementById('boxEmail').value);
      ['boxName', 'boxManager', 'boxEmail'].forEach(id => { document.getElementById(id).value = ''; });
      DATA.boxes = (DATA.boxes || []).concat([b]);
      renderBoxes(DATA.boxes);
      renderTools(DATA.tools); // 工具カードの工具箱プルダウンに新しい選択肢を出す
      showMsg('msg', '工具箱 ' + b.name + ' を追加しました', 'ok');
      btnFlash(btn, true, '✓ 追加しました');
    } catch (e) {
      btnFlash(btn, false);
      showMsg('msg', e.message || String(e), 'err');
    }
  });
  document.getElementById('boxes').addEventListener('click', async function (ev) {
    const b = ev.target.closest('button[data-bact]');
    if (!b) return;
    const card = b.closest('.card');
    const id = card.dataset.box;
    const act = b.dataset.bact;
    try {
      if (act === 'save') {
        btnBusy(b, '保存中…');
        const r = await call('adminUpdateBox', PIN, id, card.querySelector('.bName').value, card.querySelector('.bManager').value, card.querySelector('.bEmail').value);
        showMsg('msg', '工具箱 ' + r.name + '（' + id + '）を保存しました', 'ok');
        await load();
        btnFlash(document.querySelector('#boxes .card[data-box="' + CSS.escape(id) + '"] button[data-bact="save"]'), true, '✓ 保存しました');
      } else if (act === 'del') {
        if (!confirm(id + ' を削除しますか？')) return;
        btnBusy(b, '削除中…');
        await call('adminDeleteBox', PIN, id);
        showMsg('msg', id + ' を削除しました', 'ok');
        await load();
      }
    } catch (e) {
      btnFlash(b, false);
      showMsg('msg', e.message || String(e), 'err');
    }
  });

  // ---- 工具 ----
  function renderTools(tools) {
    const box = document.getElementById('tools');
    box.className = '';
    document.getElementById('overdueBanner').innerHTML = overdueBanner(tools);
    if (!tools.length) { box.innerHTML = '<div class="muted">工具がありません</div>'; return; }
    box.innerHTML = sortOverdueFirst(tools).map(toolCardHtml).join('');
    drawQr(box);
  }

  // サーバーを読み直さず、1 枚のカードだけ差し替える（保存・貸出・返却の応答が速くなる）
  function replaceToolCard(t) {
    const i = DATA.tools.findIndex(x => x.id === t.id);
    if (i >= 0) DATA.tools[i] = t; else DATA.tools.push(t);
    const box = document.getElementById('tools');
    const old = box.querySelector('.card[data-id="' + CSS.escape(t.id) + '"]');
    const tmp = document.createElement('div');
    tmp.innerHTML = toolCardHtml(t);
    const fresh = tmp.firstElementChild;
    if (old) old.replaceWith(fresh);
    else { if (box.className === 'muted') { box.className = ''; box.innerHTML = ''; } box.appendChild(fresh); }
    drawQr(fresh);
    document.getElementById('overdueBanner').innerHTML = overdueBanner(DATA.tools);
    return fresh;
  }
  function removeToolCard(id) {
    DATA.tools = DATA.tools.filter(x => x.id !== id);
    const old = document.querySelector('#tools .card[data-id="' + CSS.escape(id) + '"]');
    if (old) old.remove();
    if (!DATA.tools.length) renderTools(DATA.tools);
  }
  // 工具箱ごとの点数を手元のデータから数え直す
  function recountBoxes() {
    (DATA.boxes || []).forEach(b => { b.toolCount = DATA.tools.filter(t => t.box && t.box.id === b.id).length; });
    renderBoxes(DATA.boxes);
  }

  function toolCardHtml(t) {
    {
      const status = t.inUse ? usedBadge(t) : '<span class="badge free">空き</span>';
      const rentRow = t.inUse
        ? '<div class="row"><button type="button" class="btn small gray" data-act="return" data-name="' + esc(t.name) + '">返却（管理者）</button></div>'
        : '<div class="row"><button type="button" class="btn small green" data-act="rentToggle">借りる（代理）</button></div>' +
          '<div class="row rentBox" hidden>' +
          '<input type="text" class="rentName" placeholder="使用者名">' +
          '<input type="date" class="rentDue" min="' + esc(TODAY) + '" value="' + esc(DEFAULT_DUE) + '">' +
          '<input type="text" class="rentComment" placeholder="コメント（任意）" maxlength="200">' +
          '<button type="button" class="btn small green" data-act="rent">確定</button>' +
          '</div>';
      return '<div class="card' + (t.overdue ? ' overdue' : '') + '" data-id="' + esc(t.id) + '">' +
        '<div class="head"><b>' + esc(t.id) + '</b> ' + status + '</div>' +
        (t.overdue ? '<div class="overdue-text" style="margin-top:6px">返却期限を ' + esc(t.overdueDays) + ' 日過ぎています</div>' : '') +
        '<div class="row">' +
        '<input type="text" class="nameInput" value="' + esc(t.name) + '">' +
        boxSelect('boxInput', t.box ? t.box.id : '') +
        '<button type="button" class="btn small" data-act="save">保存</button>' +
        '<button type="button" class="btn small red" data-act="del"' + (t.inUse ? ' disabled' : '') + '>削除</button>' +
        '</div>' +
        (t.inUse ? returnToLine(t) : '') +
        (t.inUse && t.comment ? '<div class="muted" style="margin-top:6px">' + esc(t.comment) + '</div>' : '') +
        (t.inUse && t.email ? '<div class="muted" style="margin-top:6px">' + esc(t.email) + '</div>' : '') +
        (t.inUse ? '<div class="muted" style="margin-top:6px">端末ID: ' + (t.device ? esc(t.device.slice(0, 8)) + '…' : '（なし・誰でも返却可）') + '</div>' : '') +
        rentRow +
        '<div class="row"><div class="qr" data-url="' + esc(t.qrUrl) + '"></div>' +
        '<div style="flex:1;min-width:160px"><div class="mono">' + esc(t.qrUrl) + '</div>' +
        '<button type="button" class="btn small gray" data-act="copy" style="margin-top:6px">URLをコピー</button></div></div>' +
        '</div>';
    }
  }

  function drawQr(root) {
    if (typeof QRCode === 'undefined') return; // CDN が読めない環境は URL 表示のみ
    root.querySelectorAll('.qr').forEach(el => {
      el.innerHTML = '';
      try { new QRCode(el, { text: el.dataset.url, width: 96, height: 96, correctLevel: QRCode.CorrectLevel.M }); } catch (e) {}
    });
  }

  document.getElementById('tools').addEventListener('click', async function (ev) {
    const b = ev.target.closest('button[data-act]');
    if (!b) return;
    const card = b.closest('.card');
    const id = card.dataset.id;
    const act = b.dataset.act;
    if (act === 'rentToggle') {
      const box = card.querySelector('.rentBox');
      box.hidden = !box.hidden;
      return;
    }
    try {
      if (act === 'return') {
        if (!confirm(b.dataset.name + ' を返却にしますか？（端末に関係なく返却します）')) return;
        btnBusy(b, '返却中…');
        const t = await call('adminReturnTool', PIN, id);
        replaceToolCard(t);
        showMsg('msg', t.name + ' を返却にしました', 'ok');
        return;
      }
      if (act === 'rent') {
        const name = card.querySelector('.rentName').value;
        const due = card.querySelector('.rentDue').value;
        const comment = card.querySelector('.rentComment').value;
        btnBusy(b, '送信中…');
        const t = await call('adminRentTool', PIN, id, name, due, comment);
        replaceToolCard(t);
        showMsg('msg', t.name + ' を ' + name + ' さんに ' + fmtMd(t.due) + ' まで貸しました', 'ok');
        return;
      }
      if (act === 'copy') {
        const ok = await copyText(card.querySelector('.qr').dataset.url);
        btnFlash(b, ok, ok ? '✓ コピーしました' : '✗ コピー失敗');
        if (!ok) showMsg('msg', 'コピーできませんでした。URL を長押しして選択してください', 'err');
        return;
      }
      if (act === 'save') {
        const name = card.querySelector('.nameInput').value;
        btnBusy(b, '保存中…');
        const t = await call('adminUpdateTool', PIN, id, name, card.querySelector('.boxInput').value);
        const fresh = replaceToolCard(t);
        recountBoxes();
        showMsg('msg', t.name + '（' + id + '）を保存しました' + (t.box ? '　工具箱: ' + t.box.name : ''), 'ok');
        btnFlash(fresh.querySelector('button[data-act="save"]'), true, '✓ 保存しました');
        return;
      }
      if (act === 'del') {
        if (!confirm(id + ' を削除しますか？')) return;
        btnBusy(b, '削除中…');
        await call('adminDeleteTool', PIN, id);
        removeToolCard(id);
        recountBoxes();
        showMsg('msg', id + ' を削除しました', 'ok');
      }
    } catch (e) {
      btnFlash(b, false);
      showMsg('msg', e.message || String(e), 'err');
    }
  });

  document.getElementById('addForm').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    const input = document.getElementById('addName');
    const btn = this.querySelector('button[type=submit]');
    btnBusy(btn, '追加中…');
    try {
      const t = await call('adminAddTool', PIN, input.value, document.getElementById('addBox').value);
      input.value = '';
      replaceToolCard(t);
      recountBoxes();
      showMsg('msg', t.id + ' ' + t.name + ' を追加しました', 'ok');
      btnFlash(btn, true, '✓ 追加しました');
    } catch (e) {
      btnFlash(btn, false);
      showMsg('msg', e.message || String(e), 'err');
    }
  });

  document.getElementById('printBtn').addEventListener('click', function () {
    window.open(APP_URL + '?view=print&pin=' + encodeURIComponent(PIN), '_blank');
  });
  document.getElementById('reloadBtn').addEventListener('click', load);

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (e) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand('copy');
        ta.remove();
        return ok;
      } catch (e2) { return false; }
    }
  }

  // ---- 設定 ----
  function renderSettings(s) {
    document.getElementById('typeHuman').classList.toggle('active', s.manager_type !== 'ai');
    document.getElementById('typeAi').classList.toggle('active', s.manager_type === 'ai');
    document.getElementById('aiNote').textContent = s.manager_type === 'ai'
      ? (s.claude_api_key_set ? '通知は AI（Claude）が処理します' : 'claude_api_key が未設定のため、実際にはメール通知になります（設定シートで入力）')
      : '通知は管理者メールに送ります';
    document.getElementById('notifyOnRequest').checked = s.notify_on_request;
    document.getElementById('managerEmail').value = s.manager_email;
    document.getElementById('newPin').value = s.admin_pin;
    document.getElementById('appUrlInput').value = s.app_url;
  }

  async function saveSettings(patch, okText, btn) {
    btnBusy(btn, '保存中…');
    try {
      const s = await call('adminSaveSettings', PIN, patch);
      if (patch.admin_pin) { PIN = s.admin_pin; storeSet('session', PIN_KEY, PIN); }
      DATA.settings = s;
      renderSettings(s);
      document.getElementById('urlWarn').innerHTML = s.app_url ? '' :
        '<div class="msg err">app_url が未設定です。デプロイ後の Web アプリ URL を下の設定で保存してください（QR・メールのリンクに使います）。</div>';
      showMsg('msg', okText, 'ok');
      btnFlash(btn, true, '✓ 保存しました');
    } catch (e) {
      btnFlash(btn, false);
      showMsg('msg', e.message || String(e), 'err');
    }
  }
  document.getElementById('typeHuman').addEventListener('click', function () { saveSettings({ manager_type: 'human' }, '管理者を human にしました', this); });
  document.getElementById('typeAi').addEventListener('click', function () { saveSettings({ manager_type: 'ai' }, '管理者を ai にしました', this); });
  document.getElementById('notifyOnRequest').addEventListener('change', function () {
    saveSettings({ notify_on_request: this.checked }, this.checked ? '貸出時にメールを送ります' : '貸出時のメールを止めました');
  });
  document.getElementById('saveEmail').addEventListener('click', function () { saveSettings({ manager_email: document.getElementById('managerEmail').value }, '管理者メールを保存しました', this); });
  document.getElementById('savePin').addEventListener('click', function () { saveSettings({ admin_pin: document.getElementById('newPin').value }, 'PIN を変更しました', this); });
  document.getElementById('saveUrl').addEventListener('click', function () { saveSettings({ app_url: document.getElementById('appUrlInput').value }, 'app_url を保存しました', this); });

  // ---- ログ ----
  function renderLogs(logs) {
    const tb = document.getElementById('logs');
    if (!logs.length) { tb.innerHTML = '<tr><td colspan="6" class="muted">ログはありません</td></tr>'; return; }
    tb.innerHTML = logs.map(l =>
      '<tr><td>' + esc(l.at) + '</td><td>' + esc(l.op) + '</td><td>' + esc(l.name) + '</td><td>' + esc(l.user) + '</td><td>' + esc(l.due) + '</td><td>' + esc(l.note) + '</td></tr>'
    ).join('');
  }

  // ---- 起動 ----
  if (PIN) enter();
</script>
</body>
</html>
