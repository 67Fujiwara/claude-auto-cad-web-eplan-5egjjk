<!--
  List.html — 一覧画面（?view=list）
  工具ごとに1カード。空き＝緑、使用中＝赤「〇〇さん 9/20まで」、超過＝濃い赤「超過」バッジ。
  空きの工具には「選択」ボタン。押すと青い「選択中」になり、1 つでも選ぶと画面下に固定の「借りる」バーが出る。
  「借りる」→ 名前・返却日・コメントを入れて「確定」で、選んだ工具をまとめて借りる（apiRequestMany）。
  自分が借りている工具（端末IDが一致）には「返却を選択」ボタン。押すと青い「返却選択中」になり、
  画面下のバーの「返却」でまとめて返却する（apiReturnMany）。延長は「+3日 / +7日 / 日付指定」。
-->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <base target="_top">
  <title><?= pageTitle ?></title>
</head>
<body>
<?!= include_('Common', { appUrl: appUrl }) ?>
<div class="wrap">
  <div class="head">
    <h1>工具一覧</h1>
    <button class="btn small gray" id="reload" type="button">更新</button>
  </div>
  <div id="msg"></div>
  <div id="overdueBanner"></div>
  <div id="cards" class="muted">読み込み中…</div>
</div>

<!-- 複数選択の「借りる」バー（1 つでも選ぶと表示。スクロールしても画面下に固定） -->
<div id="bar" class="fixbar" hidden>
  <div class="inner">
    <div id="barSummary" class="head">
      <div><b id="selCount">0</b> 件選択中</div>
      <div class="row" style="margin:0">
        <button type="button" class="btn small gray" id="clearSel">解除</button>
        <button type="button" class="btn red" id="doReturn" hidden>返却</button>
        <button type="button" class="btn green" id="openRent" hidden>借りる</button>
      </div>
    </div>
    <form id="rentForm" hidden>
      <div class="muted" id="rentList"></div>
      <label for="rName">名前</label>
      <input type="text" id="rName" autocomplete="name" required>
      <label for="rDue">返却日</label>
      <input type="date" id="rDue" required>
      <label for="rComment">コメント（任意）</label>
      <input type="text" id="rComment" maxlength="200" placeholder="使用場所など">
      <div id="rentMsg"></div>
      <div class="row">
        <button type="button" class="btn gray" id="cancelRent">やめる</button>
        <button type="submit" class="btn green" id="submitRent" style="flex:1">確定</button>
      </div>
    </form>
  </div>
</div>
<script>
  let TODAY = '';
  const cards = document.getElementById('cards');
  const selected = new Set();      // 借りる対象として選択中の tool_id
  const selectedRet = new Set();   // 返却対象として選択中の tool_id
  const toolsById = {};            // 最新の一覧（id → tool）

  async function loadList() {
    try {
      const r = await call('apiListTools', deviceId());
      TODAY = r.today;
      renderList(r.tools);
    } catch (e) {
      showMsg('msg', e.message || String(e), 'err');
    }
  }

  function renderList(tools) {
    if (!tools.length) {
      cards.innerHTML = '<div class="muted">工具が登録されていません</div>';
      return;
    }
    cards.className = '';
    Object.keys(toolsById).forEach(k => delete toolsById[k]);
    tools.forEach(t => { toolsById[t.id] = t; });
    document.getElementById('overdueBanner').innerHTML = overdueBanner(tools);
    tools = sortOverdueFirst(tools);
    // 使用中になった工具は貸出選択から外し、返却できなくなった工具は返却選択から外す
    Array.from(selected).forEach(id => { if (!toolsById[id] || toolsById[id].inUse) selected.delete(id); });
    Array.from(selectedRet).forEach(id => { if (!toolsById[id] || !toolsById[id].canReturn) selectedRet.delete(id); });
    cards.innerHTML = tools.map(t => {
      const badge = t.inUse ? usedBadge(t) : '<span class="badge free">空き</span>';
      const returnBtn = t.canReturn
        ? retBtn(t.id)
        : '<span class="muted" style="align-self:center">返却は借りた端末から</span>';
      const actions = t.inUse ? (
        '<div class="row">' +
        returnBtn +
        '<button class="btn small" data-act="extend" data-days="3" data-id="' + esc(t.id) + '">+3日</button>' +
        '<button class="btn small" data-act="extend" data-days="7" data-id="' + esc(t.id) + '">+7日</button>' +
        '<button class="btn small" data-act="pick" data-id="' + esc(t.id) + '">日付指定</button>' +
        '</div>' +
        '<div class="row" id="pick-' + esc(t.id) + '" hidden>' +
        '<input type="date" id="date-' + esc(t.id) + '" min="' + esc(TODAY) + '" value="' + esc(t.due) + '">' +
        '<button class="btn small" data-act="extendDate" data-id="' + esc(t.id) + '">延長</button>' +
        '</div>'
      ) : (
        '<div class="row">' + selectBtn(t.id) + '</div>'
      );
      const comment = t.comment ? '<div class="muted" style="margin-top:4px">' + esc(t.comment) + '</div>' : '';
      const overdueLine = t.overdue
        ? '<div class="overdue-text" style="margin-top:6px">返却期限を ' + esc(t.overdueDays) + ' 日過ぎています（' + esc(fmtMd(t.due)) + ' 返却予定）</div>'
        : '';
      return '<div class="card' + (t.overdue ? ' overdue' : '') + '">' +
        '<div class="head"><div><b>' + esc(t.name) + '</b> <span class="muted">' + esc(t.id) + '</span></div><div>' + badge + '</div></div>' +
        overdueLine +
        comment +
        actions +
        '</div>';
    }).join('');
    updateBar();
  }

  // 選択ボタン: 未選択=灰色「選択」、選択中=青「選択中」
  function selectBtn(id) {
    const on = selected.has(id);
    return '<button type="button" class="btn small ' + (on ? '' : 'gray') + '" data-act="select" data-id="' + esc(id) + '">' + (on ? '選択中' : '選択') + '</button>';
  }
  // 返却ボタン: 未選択=灰色「返却を選択」、選択中=青「返却選択中」
  function retBtn(id) {
    const on = selectedRet.has(id);
    return '<button type="button" class="btn small ' + (on ? '' : 'gray') + '" data-act="selectRet" data-id="' + esc(id) + '">' + (on ? '返却選択中' : '返却を選択') + '</button>';
  }
  function toggleSelect(id, btn) {
    if (selected.has(id)) selected.delete(id); else selected.add(id);
    btn.outerHTML = selectBtn(id);
    updateBar();
  }
  function toggleSelectRet(id, btn) {
    if (selectedRet.has(id)) selectedRet.delete(id); else selectedRet.add(id);
    btn.outerHTML = retBtn(id);
    updateBar();
  }
  function updateBar() {
    const bar = document.getElementById('bar');
    const n = selected.size, m = selectedRet.size;
    document.getElementById('selCount').textContent = n + m;
    bar.hidden = (n + m) === 0;
    document.body.classList.toggle('has-fixbar', (n + m) > 0);
    document.getElementById('openRent').hidden = n === 0;
    document.getElementById('openRent').textContent = '借りる' + (n ? '（' + n + '）' : '');
    document.getElementById('doReturn').hidden = m === 0;
    document.getElementById('doReturn').textContent = '返却' + (m ? '（' + m + '）' : '');
    if (n === 0) closeRentForm();
    document.getElementById('rentList').textContent = Array.from(selected).map(id => toolsById[id] ? toolsById[id].name : id).join('、');
  }
  function openRentForm() {
    document.getElementById('barSummary').hidden = true;
    const f = document.getElementById('rentForm');
    f.hidden = false;
    const name = document.getElementById('rName');
    name.value = name.value || storeGet('local', 'tr_name') || '';
    const due = document.getElementById('rDue');
    due.min = TODAY;
    if (!due.value) due.value = addDays(TODAY, 7);
    showMsg('rentMsg', '');
    name.focus();
  }
  function closeRentForm() {
    document.getElementById('barSummary').hidden = false;
    document.getElementById('rentForm').hidden = true;
  }
  function addDays(ymd, days) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(ymd || '');
    if (!m) return '';
    const d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3] + days));
    return d.toISOString().slice(0, 10);
  }
  document.getElementById('openRent').addEventListener('click', openRentForm);
  document.getElementById('cancelRent').addEventListener('click', closeRentForm);
  document.getElementById('clearSel').addEventListener('click', function () {
    selected.clear();
    selectedRet.clear();
    cards.querySelectorAll('button[data-act="select"]').forEach(b => { b.outerHTML = selectBtn(b.dataset.id); });
    cards.querySelectorAll('button[data-act="selectRet"]').forEach(b => { b.outerHTML = retBtn(b.dataset.id); });
    updateBar();
  });
  document.getElementById('doReturn').addEventListener('click', async function () {
    const ids = Array.from(selectedRet);
    const names = ids.map(id => toolsById[id] ? toolsById[id].name : id);
    if (!confirm(names.join('、') + ' を返却しますか？')) return;
    const btn = this;
    btn.disabled = true;
    try {
      const r = await call('apiReturnMany', ids, deviceId());
      let text = r.ok.length ? r.ok.map(t => t.name).join('、') + ' を返却しました' : '';
      if (r.failed.length) text += (text ? '。' : '') + '返却できなかった工具: ' + r.failed.map(f => f.name + '（' + f.message + '）').join(' / ');
      showMsg('msg', text, r.failed.length ? 'err' : 'ok');
      selectedRet.clear();
      updateBar();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      loadList();
    } catch (e) {
      showMsg('msg', e.message || String(e), 'err');
    } finally {
      btn.disabled = false;
    }
  });
  document.getElementById('rentForm').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    const btn = document.getElementById('submitRent');
    const name = document.getElementById('rName').value.trim();
    const due = document.getElementById('rDue').value;
    const comment = document.getElementById('rComment').value;
    btn.disabled = true;
    showMsg('rentMsg', '送信中…', 'info');
    storeSet('local', 'tr_name', name);
    try {
      const r = await call('apiRequestMany', Array.from(selected), name, due, comment, deviceId());
      const okNames = r.ok.map(t => t.name).join('、');
      let text = r.ok.length ? okNames + ' を ' + fmtMd(due) + ' まで借りました' : '';
      if (r.failed.length) text += (text ? '。' : '') + '借りられなかった工具: ' + r.failed.map(f => f.name + '（' + f.message + '）').join(' / ');
      showMsg('msg', text, r.failed.length ? 'err' : 'ok');
      selected.clear();
      document.getElementById('rComment').value = '';
      updateBar();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      loadList();
    } catch (e) {
      showMsg('rentMsg', e.message || String(e), 'err');
    } finally {
      btn.disabled = false;
    }
  });

  cards.addEventListener('click', async function (ev) {
    const b = ev.target.closest('button[data-act]');
    if (!b) return;
    const id = b.dataset.id;
    const act = b.dataset.act;
    if (act === 'select') {
      toggleSelect(id, b);
      return;
    }
    if (act === 'selectRet') {
      toggleSelectRet(id, b);
      return;
    }
    if (act === 'pick') {
      const box = document.getElementById('pick-' + id);
      box.hidden = !box.hidden;
      return;
    }
    try {
      if (act === 'extend') {
        setBusy(true);
        const t = await call('apiExtend', id, Number(b.dataset.days), null);
        showMsg('msg', t.name + ' を ' + fmtMd(t.due) + ' まで延長しました', 'ok');
      } else if (act === 'extendDate') {
        const date = document.getElementById('date-' + id).value;
        if (!date) { alert('日付を選んでください'); return; }
        setBusy(true);
        const t = await call('apiExtend', id, null, date);
        showMsg('msg', t.name + ' を ' + fmtMd(t.due) + ' まで延長しました', 'ok');
      }
    } catch (e) {
      showMsg('msg', e.message || String(e), 'err');
    } finally {
      setBusy(false);
      loadList();
    }
  });

  function setBusy(on) {
    cards.querySelectorAll('button').forEach(b => { b.disabled = on; });
  }

  document.getElementById('reload').addEventListener('click', () => { showMsg('msg', ''); loadList(); });
  loadList();
</script>
</body>
</html>
