<!--
  Request.html — 貸出申請画面（?tool=T1_ID001）
  QR コードを読むとこの画面が開く。
  1. まず、この端末（localStorage の端末ID）で借りている工具があれば「借りている工具」の一覧を出す。
     読み取った工具がその中にあれば最初から選択済み。複数選んで画面下の固定バー「返却」でまとめて返却する。
  2. 借りている工具が無い（または「借りる」ボタンを押した）ときは、読み取った工具の申請フォームを出す。
     空きなら名前・返却日・コメント（任意）を入力して「借りる」。使用中なら誰がいつまで使っているかを表示し、
     借りたときの名前を入力すれば返却できる（端末IDが一致しない場合の本人確認。iPhone の Safari 対策）。
  名前は localStorage に保存して次回自動入力する。（社内利用のためメール欄は無し）
-->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <base target="_top">
  <title><?= pageTitle ?></title>
</head>
<body>
<?!= include_('Common', { appUrl: appUrl }) ?>
<div class="wrap">
<? if (!data.tool) { ?>
  <h1>貸出申請</h1>
  <div class="msg err">工具が見つかりません（<?= data.toolId ?>）</div>
  <a class="btn gray full" href="<?= appUrl ?>?view=list" target="_top">一覧へ</a>
<? } else { ?>

  <!-- 読み込み中 -->
  <div id="loading" class="muted">読み込み中…</div>

  <!-- 借りている工具（この端末で借りたものがあるときだけ表示） -->
  <div id="mine" hidden>
    <h1>借りている工具</h1>
    <div id="msg"></div>
    <div id="overdueBanner"></div>
    <div id="mineCards"></div>
    <div class="card" id="scanInfo">
      <div class="muted">読み取った工具</div>
      <div style="margin-top:4px"><b><?= data.tool.name ?></b> <span class="muted"><?= data.tool.id ?></span></div>
      <div class="row" id="scanActions"></div>
    </div>
  </div>

  <!-- 読み取った工具の申請 -->
  <div id="scanned" hidden>
    <h1><?= data.tool.name ?></h1>
    <div class="muted"><?= data.tool.id ?></div>

    <? if (data.tool.inUse) { ?>
      <div class="card<?= data.tool.overdue ? ' overdue' : '' ?>">
        <span class="badge used">使用中</span>
        <? if (data.tool.overdue) { ?><span class="badge over">超過</span><? } ?>
        <div style="margin-top:8px"><?= data.tool.user ?>さんが <?= data.tool.dueLabel ?> まで使用中</div>
        <? if (data.tool.overdue) { ?><div class="overdue-text" style="margin-top:4px">返却期限を <?= data.tool.overdueDays ?> 日過ぎています</div><? } ?>
        <? if (data.tool.comment) { ?><div class="muted" style="margin-top:4px"><?= data.tool.comment ?></div><? } ?>
      </div>
      <!-- 端末IDが一致しない（別の端末・保存データが消えた）場合は、借りたときの名前で本人確認して返却できる -->
      <form id="nameReturn" class="card">
        <div><b>この工具を返却する</b></div>
        <div class="muted" style="margin-top:4px">借りたときの名前を入力してください（本人確認）</div>
        <label for="retName">名前</label>
        <input type="text" id="retName" autocomplete="name" required>
        <div id="retMsg"></div>
        <button type="submit" id="retSubmit" class="btn red full">返却</button>
      </form>
      <div id="retDone" class="card" hidden>
        <div class="msg ok" id="retDoneText"></div>
        <a class="btn small green" href="<?= appUrl ?>?tool=<?= data.tool.id ?>" target="_top">この工具を借りる</a>
      </div>
      <a class="btn gray full" href="<?= appUrl ?>?view=list" target="_top">一覧へ</a>
    <? } else { ?>
      <form id="form" class="card">
        <span class="badge free">空き</span>
        <? if (data.tool.box) { ?><div class="muted" style="margin-top:6px">工具箱: <?= data.tool.box.name ?>　返却先: <?= data.tool.returnTo || '管理者' ?></div><? } ?>
        <label for="name">名前</label>
        <input type="text" id="name" autocomplete="name" required>
        <label>開始日</label>
        <div><?= data.today ?>（今日）</div>
        <label for="due">返却日</label>
        <input type="date" id="due" min="<?= data.today ?>" value="<?= data.defaultDue ?>" required>
        <label for="comment">コメント（任意）</label>
        <input type="text" id="comment" maxlength="200" placeholder="使用場所など">
        <div id="formMsg"></div>
        <button type="submit" id="submit" class="btn full">借りる</button>
      </form>
      <div id="done" class="card" hidden>
        <div class="msg ok" id="doneText"></div>
        <a class="btn gray full" href="<?= appUrl ?>?view=list" target="_top">一覧へ</a>
      </div>
    <? } ?>
  </div>
<? } ?>
</div>

<!-- 複数返却の固定バー（借りている工具を 1 つでも選ぶと表示。スクロールしても画面下に固定） -->
<div id="bar" class="fixbar" hidden>
  <div class="inner">
    <div class="head">
      <div><b id="selCount">0</b> 件選択中</div>
      <div class="row" style="margin:0">
        <button type="button" class="btn small gray" id="clearSel">解除</button>
        <button type="button" class="btn red" id="doReturn">返却</button>
      </div>
    </div>
  </div>
</div>

<script>
  const TOOL_ID = <?!= toJson_(data.toolId) ?>;
  const SCANNED = <?!= toJson_(data.tool) ?>;
  const selected = new Set();
  let mineTools = [];

  function selectBtn(id) {
    const on = selected.has(id);
    return '<button type="button" class="btn small ' + (on ? '' : 'gray') + '" data-act="select" data-id="' + esc(id) + '">' + (on ? '選択中' : '選択') + '</button>';
  }
  function updateBar() {
    const n = selected.size;
    document.getElementById('selCount').textContent = n;
    document.getElementById('bar').hidden = n === 0;
    document.body.classList.toggle('has-fixbar', n > 0);
  }
  function renderMine() {
    const box = document.getElementById('mineCards');
    const over = mineTools.filter(t => t.overdue);
    document.getElementById('overdueBanner').innerHTML = over.length
      ? '<div class="overdue-banner small"><b>返却期限超過 ' + over.length + ' 件</b> ' + over.map(t => esc(t.name) + '（' + esc(fmtMd(t.due)) + '・' + esc(t.overdueDays) + '日超過）').join('、') + '</div>'
      : '';
    box.innerHTML = sortOverdueFirst(mineTools).map(t =>
      '<div class="card' + (t.overdue ? ' overdue' : '') + '">' +
      '<div class="head"><div><b>' + esc(t.name) + '</b> <span class="muted">' + esc(t.id) + '</span></div>' +
      '<div>' + (t.overdue
        ? '<span class="badge over">' + esc(fmtMd(t.due)) + 'まで（' + esc(t.overdueDays) + '日超過）</span>'
        : '<span class="badge used">' + esc(fmtMd(t.due)) + 'まで</span>') + '</div></div>' +
      (t.comment ? '<div class="muted" style="margin-top:4px">' + esc(t.comment) + '</div>' : '') +
      returnToLine(t) +
      '<div class="row">' + selectBtn(t.id) + '</div>' +
      '</div>'
    ).join('');
    updateBar();
  }
  function showScanned() {
    document.getElementById('mine').hidden = true;
    document.getElementById('bar').hidden = true;
    document.body.classList.remove('has-fixbar');
    document.getElementById('scanned').hidden = false;
  }

  async function loadMine() {
    // この端末で借りた控えが無ければ、サーバーに聞かずに申請フォームをすぐ出す（1 往復を省く）
    if (!borrowedGet().length) { mineTools = []; document.getElementById('loading').hidden = true; showScanned(); return; }
    try {
      const r = await call('apiMyTools', deviceId());
      mineTools = r.tools;
      // 控えとサーバーの実態を合わせる（他端末や管理者が返却した分を落とす）
      storeSet('local', 'tr_borrowed', JSON.stringify(mineTools.map(t => t.id)));
    } catch (e) {
      mineTools = [];
    }
    document.getElementById('loading').hidden = true;
    if (!mineTools.length) { showScanned(); return; }

    // 読み取った工具が自分の借りている工具なら最初から選択
    if (mineTools.some(t => t.id === TOOL_ID)) selected.add(TOOL_ID);
    // 読み取った工具が空きなら「借りる」へ進めるボタン
    const acts = document.getElementById('scanActions');
    if (SCANNED && !SCANNED.inUse) {
      acts.innerHTML = '<button type="button" class="btn small green" id="goRent">この工具を借りる</button>';
      document.getElementById('goRent').addEventListener('click', showScanned);
    } else if (SCANNED && !mineTools.some(t => t.id === TOOL_ID)) {
      // 別の端末（または保存データが消えた）で借りた工具 → 名前で確認して返却できる画面へ
      acts.innerHTML = '<span class="muted">' + esc(SCANNED.user) + 'さんが ' + esc(fmtMd(SCANNED.due)) + ' まで使用中</span>' +
        '<button type="button" class="btn small gray" id="goNameReturn">返却（名前で確認）</button>';
      document.getElementById('goNameReturn').addEventListener('click', showScanned);
    } else {
      acts.innerHTML = '<span class="muted">上の一覧で選択済み</span>';
    }
    renderMine();
    document.getElementById('mine').hidden = false;
  }

  document.getElementById('mineCards').addEventListener('click', function (ev) {
    const b = ev.target.closest('button[data-act="select"]');
    if (!b) return;
    const id = b.dataset.id;
    if (selected.has(id)) selected.delete(id); else selected.add(id);
    b.outerHTML = selectBtn(id);
    updateBar();
  });
  document.getElementById('clearSel').addEventListener('click', function () {
    selected.clear();
    renderMine();
  });
  document.getElementById('doReturn').addEventListener('click', async function () {
    const ids = Array.from(selected);
    const names = ids.map(id => (mineTools.find(t => t.id === id) || { name: id }).name);
    if (!confirm(names.join('、') + ' を返却しますか？')) return;
    const btn = this;
    btn.disabled = true;
    try {
      const r = await call('apiReturnMany', ids, deviceId());
      borrowedRemove(r.ok.map(t => t.id));
      let text = r.ok.length ? r.ok.map(t => t.name).join('、') + ' を返却しました。' + returnToSummary(r.ok) : '';
      if (r.failed.length) text += (text ? '。' : '') + '返却できなかった工具: ' + r.failed.map(f => f.name + '（' + f.message + '）').join(' / ');
      showMsg('msg', text, r.failed.length ? 'err' : 'ok');
      selected.clear();
      const okIds = new Set(r.ok.map(t => t.id));
      mineTools = mineTools.filter(t => !okIds.has(t.id));
      renderMine();
      // 読み取った工具を返したなら、続けて借りられるようリンクを出す（画面を開き直して最新状態にする）
      if (okIds.has(TOOL_ID)) {
        document.getElementById('scanActions').innerHTML =
          '<a class="btn small green" href="' + esc(APP_URL) + '?tool=' + encodeURIComponent(TOOL_ID) + '" target="_top">この工具をもう一度借りる</a>';
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (e) {
      showMsg('msg', e.message || String(e), 'err');
    } finally {
      btn.disabled = false;
    }
  });

  // 名前で確認して返却（端末IDが一致しない場合）
  (function () {
    const form = document.getElementById('nameReturn');
    if (!form) return;
    const nameEl = document.getElementById('retName');
    const btn = document.getElementById('retSubmit');
    nameEl.value = storeGet('local', 'tr_name') || '';
    form.addEventListener('submit', async function (ev) {
      ev.preventDefault();
      const name = nameEl.value.trim();
      if (!name) { showMsg('retMsg', '名前を入力してください', 'err'); return; }
      if (!confirm(SCANNED.name + ' を返却しますか？')) return;
      btnBusy(btn, '返却中…');
      storeSet('local', 'tr_name', name);
      try {
        const r = await call('apiReturnMany', [TOOL_ID], deviceId(), name);
        if (r.failed.length) throw new Error(r.failed[0].message);
        borrowedRemove([TOOL_ID]);
        form.hidden = true;
        document.getElementById('retDoneText').textContent = r.ok[0].name + ' を返却しました。' + returnToSummary(r.ok);
        document.getElementById('retDone').hidden = false;
        btnReset(btn);
      } catch (e) {
        btnFlash(btn, false);
        showMsg('retMsg', e.message || String(e), 'err');
      }
    });
  })();

  // 申請フォーム
  (function () {
    const form = document.getElementById('form');
    if (!form) return;
    const nameEl = document.getElementById('name');
    const dueEl = document.getElementById('due');
    const commentEl = document.getElementById('comment');
    const btn = document.getElementById('submit');
    nameEl.value = storeGet('local', 'tr_name') || '';
    form.addEventListener('submit', async function (ev) {
      ev.preventDefault();
      btn.disabled = true;
      showMsg('formMsg', '送信中…', 'info');
      storeSet('local', 'tr_name', nameEl.value.trim());
      try {
        const t = await call('apiRequest', TOOL_ID, nameEl.value, '', dueEl.value, commentEl.value, deviceId());
        borrowedAdd([t.id]);
        form.hidden = true;
        document.getElementById('doneText').textContent = t.name + ' を ' + fmtMd(t.due) + ' まで借りました。返却時は ' + (t.returnTo || '管理者') + ' に返却してください。';
        document.getElementById('done').hidden = false;
      } catch (e) {
        showMsg('formMsg', e.message || String(e), 'err');
        btn.disabled = false;
      }
    });
  })();

  if (SCANNED) loadMine();
</script>
</body>
</html>
